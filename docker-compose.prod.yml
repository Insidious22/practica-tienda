services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tienda_app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - public_build:/shared-public-build
    command: >
      sh -lc "rm -rf /shared-public-build/* &&
              mkdir -p /shared-public-build &&
              cp -a /var/www/public/build/. /shared-public-build/ &&
              exec php-fpm"
    networks:
      - tienda

  web:
    image: nginx:alpine
    container_name: tienda_web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/public:ro
      - public_build:/var/www/public/build:ro
    depends_on:
      - app
    networks:
      - tienda

  db:
    image: mysql:8
    container_name: tienda_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - tienda

networks:
  tienda:
    driver: bridge

volumes:
  db_data:
  public_build:
